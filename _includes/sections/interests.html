<section id="interests" class="section section--alt">
  <div class="container">
    <h2 class="section__title">Interests</h2>
    <div class="interests-split">
      <div class="interests-split__intro">
        {% for paragraph in site.data.bio.interestsIntro %}<p>{{ paragraph }}</p>{% endfor %}
      </div>
      <div class="interests">
        {% for interest in site.data.bio.interests %}
          <span class="pill pill--accent">{{ interest.name }}</span>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
