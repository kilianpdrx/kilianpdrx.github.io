<section id="projects" class="section">
  <div class="container">
    <h2 class="section__title">Projects</h2>
    <div class="projects-grid">
      {% assign projects = site.pages | where: "type", "project" | sort: "start_date" | reverse %}
      {% for project in projects %}
        {% include projects/project-card.html project=project %}
      {% endfor %}
    </div>
  </div>
</section>
