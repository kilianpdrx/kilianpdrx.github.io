{%- assign p = include.project -%}
<a class="project-card" href="{{ site.baseurl }}{{ p.url }}">
  {% if p.image %}
    <div class="project-card__media">
      <img src="{{ site.baseurl }}/{{ p.image }}" alt="{{ p.title }}" loading="lazy">
    </div>
  {% endif %}
  <div class="project-card__body">
    <div class="project-card__head">
      <h3 class="project-card__title">{{ p.title }}</h3>
    </div>
    {% if p.period %}
      <p class="project-card__period">{{ p.period }}</p>
    {% endif %}
    {% if p.summary %}
      <p class="project-card__summary">{{ p.summary }}</p>
    {% endif %}
    {% if p.labels %}
      <div class="project-card__labels">
        {% for label in p.labels %}
          <span class="pill">{{ label }}</span>
        {% endfor %}
      </div>
    {% endif %}
    <span class="project-card__more">Read more &rarr;</span>
  </div>
</a>
